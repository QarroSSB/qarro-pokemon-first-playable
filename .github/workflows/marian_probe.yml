name: Qarro Marian RU Probe

on:
  push:
    branches:
      - tool/marian-probe-20260919
  workflow_dispatch:

jobs:
  marian-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install translation stack
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir \
            "transformers==4.56.2" "sentencepiece==0.2.1" "sacremoses==0.1.1"
      - name: Translate representative game strings
        run: |
          python - <<'PY'
          import json
          from transformers import MarianMTModel, MarianTokenizer
          name="Helsinki-NLP/opus-mt-en-ru"
          tok=MarianTokenizer.from_pretrained(name)
          model=MarianMTModel.from_pretrained(name)
          src=[
            "Welcome to the POKEMON CABLE CLUB. Which of our services do you wish to use?",
            "Trade POKEMON with another player using a GBA Game Link cable.",
            "Would you like to give up on this battle and quit now?",
            "The save file is corrupted. The previous save file will be loaded.",
            "A fertilizer for growing Berries that increases the harvest.",
            "The opposing POKEMON is too strong to catch! You need to weaken it first.",
            "Your POKEMON party is full.",
            "No matching POKEMON were found.",
            "The sea is deep here. Would you like to use DIVE?",
            "This tree looks like it can be cut down! Would you like to use CUT?",
            "CANCEL",
            "ANSWER",
            "SEAFLOOR",
            "HEAVY RAIN",
          ]
          batch=tok(src,return_tensors="pt",padding=True,truncation=True,max_length=256)
          out=model.generate(**batch,max_new_tokens=256,num_beams=4)
          ru=tok.batch_decode(out,skip_special_tokens=True)
          data=[{"en":a,"ru":b} for a,b in zip(src,ru)]
          print(json.dumps(data,ensure_ascii=False,indent=2))
          open("marian_probe.json","w",encoding="utf-8").write(json.dumps(data,ensure_ascii=False,indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: marian-probe
          path: marian_probe.json
