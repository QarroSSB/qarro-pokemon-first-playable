name: Qarro Translation Probe

on:
  workflow_dispatch:

jobs:
  translation-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Argos Translate
        run: pip install --disable-pip-version-check argostranslate==1.10.0
