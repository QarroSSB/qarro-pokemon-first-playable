name: Qarro Translation Probe

on:
  push:
    branches:
      - tool/translation-probe-20260919
  workflow_dispatch:

jobs:
  translation-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install translator
        run: pip install --disable-pip-version-check deep-translator==1.11.4
      - name: Translate probe
        run: |
          python - <<'PY'
          import json
          from deep_translator import GoogleTranslator
          src = [
              "The save file is corrupted. The previous save file will be loaded.",
              "Would you like to give up on this battle and quit now?",
              "A fertilizer for growing Berries that increases the harvest."
          ]
          tr = GoogleTranslator(source="en", target="ru")
          out = [{"en": s, "ru": tr.translate(s)} for s in src]
          print(json.dumps(out, ensure_ascii=False, indent=2))
          open("translation_probe.json","w",encoding="utf-8").write(json.dumps(out,ensure_ascii=False,indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: translation-probe
          path: translation_probe.json
