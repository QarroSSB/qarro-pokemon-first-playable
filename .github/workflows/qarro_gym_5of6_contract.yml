name: Qarro Gym 5-of-6 contract

on:
  push:
    branches:
      - test/gym-5of6-rework-20260911
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  gym-5of6-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact test commit
        uses: actions/checkout@v4

      - name: Verify source wiring is the isolated 5-of-6 contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'GYM_PATH = "ci/gym_five_v3_25.py"' ci/balance_kanto_v3_2_base.py
          grep -F 'QARRO_GYM_FIVE_V3_26_BEGIN' ci/gym_five_v3_25.py
          grep -F 'TryCreateQarroFiveOfSixGymParty' ci/gym_five_v3_25.py
          grep -F 'tempTrainer.partySize = PARTY_SIZE - 1;' ci/gym_five_v3_25.py
          grep -F 'reservePick = (READ_OTID_FROM_SAVE + (gymIndex + 1) * 17) % (PARTY_SIZE - 1);' ci/gym_five_v3_25.py
          grep -F 'designatedAceGuaranteed": True' ci/gym_five_v3_25.py
          grep -F 'ashBondTouched": False' ci/gym_five_v3_25.py
          grep -F 'ashCapTouched": False' ci/gym_five_v3_25.py

      - name: Wait for exact same-commit FireRed build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          build_run=""
          for attempt in $(seq 1 60); do
            runs="$(gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&branch=$GITHUB_REF_NAME&event=push&per_page=20")"
            build_run="$(printf '%s' "$runs" | jq -r '.workflow_runs[] | select(.path == ".github/workflows/qarro_first_playable_build.yml") | .id' | head -n1)"
            if [[ -n "$build_run" && "$build_run" != "null" ]]; then
              status="$(printf '%s' "$runs" | jq -r --argjson id "$build_run" '.workflow_runs[] | select(.id == $id) | .status')"
              conclusion="$(printf '%s' "$runs" | jq -r --argjson id "$build_run" '.workflow_runs[] | select(.id == $id) | (.conclusion // "")')"
              if [[ "$status" == "completed" ]]; then
                [[ "$conclusion" == "success" ]] || { echo "Exact same-commit FireRed build failed: $conclusion"; exit 1; }
                break
              fi
            fi
            sleep 10
          done
          [[ -n "$build_run" && "$build_run" != "null" ]] || { echo "No FireRed build found for $GITHUB_SHA"; exit 1; }
          echo "BUILD_RUN_ID=$build_run" >> "$GITHUB_ENV"

      - name: Verify built artifact retained 5-of-6 runtime wiring
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p baseline
          artifact_name="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID/artifacts?per_page=100" --jq '.artifacts[] | select(.name | startswith("Qarro-FIRST-PLAYABLE-v3.8-")) | .name' | head -n1)"
          [[ -n "$artifact_name" ]] || { echo "Current build artifact not found"; exit 1; }
          gh run download "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$artifact_name" --dir baseline
          test -f baseline/qarro_applied_diff_v3_8.patch
          test -f baseline/Qarro_FIRST_PLAYABLE_v3_8.gba
          grep -F 'QARRO_GYM_FIVE_V3_26_BEGIN' baseline/qarro_applied_diff_v3_8.patch
          grep -F 'TryCreateQarroFiveOfSixGymParty' baseline/qarro_applied_diff_v3_8.patch
          grep -F 'tempTrainer.partySize = PARTY_SIZE - 1;' baseline/qarro_applied_diff_v3_8.patch
          grep -F 'reservePick = (READ_OTID_FROM_SAVE + (gymIndex + 1) * 17) % (PARTY_SIZE - 1);' baseline/qarro_applied_diff_v3_8.patch
          grep -F 'if (omitted >= aceIndex)' baseline/qarro_applied_diff_v3_8.patch
          echo "PASS: exact same-commit built FireRed artifact retains save-stable Ace-protected 5-of-6 Gym runtime wiring"
