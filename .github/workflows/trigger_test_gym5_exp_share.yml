name: Trigger Qarro gym5 + Exp Share test build

on:
  push:
    branches:
      - test/gym5-exp-share
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch main build workflow on this test branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/qarro_first_playable_build.yml/dispatches" \
            -d "{\"ref\":\"${REF}\"}"
          echo "Dispatched qarro_first_playable_build.yml on ${REF}"
