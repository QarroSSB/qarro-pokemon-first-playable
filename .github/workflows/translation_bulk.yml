name: Qarro Bulk RU Translation Generator

on:
  push:
    branches:
      - tool/translation-probe-20260919
  workflow_dispatch:

permissions:
  contents: write

env:
  PINNED: e8bd1cd7b03fc032ea37e3ecd38b379b5d01a1e7
  KIT_TGZ_SHA256: 95ca1dd309d79ecfed86e21b441725c8b68b7ec0368efc33dcf790be0d62eed9
  KIT_B64_SHA256: 19e30690575cf31d941f9e183c7e52f452238a4d18759577c520909a718e01c1
  EXPECTED_BASE_CANDIDATES: "3881"

jobs:
  generate-static-translation-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout generator branch
        uses: actions/checkout@v4
        with:
          path: qarro-repo

      - name: Reconstruct exact FIRST PLAYABLE kit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p kit/normalized_parts
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          expected = [
              ('part00', 6000, '3e940e9b1a1d3b1ef4a4414a1a1fa943a76daecdee7bc7298c28d42dbfdf4ce6'),
              ('part01', 6000, 'e94329bbc06c3c5b957cb61bdd7d598866fb2491682d6057d54d5d8ad6c0ac54'),
              ('part02', 6000, '166ecb7390b18d9880810dd9e9e2b5bb2a14609cb94a2a35967cd397b0c218d7'),
              ('part03', 6000, '70a4fa13ef17c2778aeffb53dea204476003c202372e25c87e71c3a2d18002ee'),
              ('part04', 6000, '4bcc27379e86b2ce3ce3b8183a47ba355406349e4a79b68fc826b4bf474f1321'),
              ('part05', 5320, '25b0c7a8c5ba212ffa5740107a14d5c94a3f1fddc4c3ccc84d08989c5c21779e'),
          ]
          srcdir = Path('qarro-repo/kit_parts')
          outdir = Path('kit/normalized_parts')
          for short, expected_len, expected_sha in expected:
              data = (srcdir / f'qarro_kit_v3_0.{short}.b64').read_bytes()
              if hashlib.sha256(data).hexdigest() == expected_sha:
                  fixed = data
              elif len(data) == expected_len + 1:
                  fixed = None
                  for i in range(len(data)):
                      candidate = data[:i] + data[i+1:]
                      if hashlib.sha256(candidate).hexdigest() == expected_sha:
                          fixed = candidate
                          break
                  if fixed is None:
                      raise SystemExit(f'{short}: one-byte transport repair failed')
              else:
                  raise SystemExit(f'{short}: checksum/size mismatch')
              if len(fixed) != expected_len or hashlib.sha256(fixed).hexdigest() != expected_sha:
                  raise SystemExit(f'{short}: normalized verification failed')
              (outdir / f'{short}.b64').write_bytes(fixed)
          PY
          cat kit/normalized_parts/part*.b64 > kit/qarro_kit_text.tar.gz.b64
          echo "$KIT_B64_SHA256  kit/qarro_kit_text.tar.gz.b64" | sha256sum -c -
          base64 -d kit/qarro_kit_text.tar.gz.b64 > kit/qarro_kit_text.tar.gz
          echo "$KIT_TGZ_SHA256  kit/qarro_kit_text.tar.gz" | sha256sum -c -
          tar -xzf kit/qarro_kit_text.tar.gz -C kit

      - name: Checkout exact Expansion 1.17.0
        uses: actions/checkout@v4
        with:
          repository: rh-hideout/pokeemerald-expansion
          ref: ${{ env.PINNED }}
          path: upstream

      - name: Install state reproduction dependencies
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir Pillow

      - name: Reproduce exact FULL GREEN v3.173 state
        shell: bash
        run: |
          set -euo pipefail
          python3 kit/Source_Migration/v3_0/tools/install_first_playable_v3_0.py upstream
          python3 qarro-repo/ci/content_pass_v3_1.py upstream
          python3 qarro-repo/ci/runtime_content_v3_3.py upstream
          python3 qarro-repo/ci/qol_v3_5.py upstream
          python3 qarro-repo/ci/install_cyrillic_v3_3.py upstream
          python3 qarro-repo/ci/localization_ru_core_v3_3.py upstream
          python3 qarro-repo/ci/localize_early_kanto_v3_9.py upstream
          python3 qarro-repo/ci/localize_cerulean_misty_v3_22.py upstream
          python3 qarro-repo/ci/localize_oaks_lab_starter_v3_5.py upstream
          python3 qarro-repo/ci/sanitize_ru_quotes_v3_18.py upstream
          python3 qarro-repo/ci/normalize_accented_e_v3_8.py upstream

      - name: Verify exact base audit count
        run: |
          set -euo pipefail
          python qarro-repo/ci/audit_ru_runtime_surface_v3_21.py upstream
          python - <<'PY'
          import json, os
          p="upstream/build/qarro_ru_runtime_surface_v3_21_audit.json"
          j=json.load(open(p,encoding="utf-8"))["fullSurface"]
          n=j["englishOnlyCandidateCount"]
          exp=int(os.environ["EXPECTED_BASE_CANDIDATES"])
          print("base candidates", n, "files", j["filesWithCandidates"])
          if n != exp:
              raise SystemExit(f"expected exact base {exp}, got {n}")
          PY
          cp upstream/build/qarro_ru_runtime_surface_v3_21_audit.json base_audit.json

      - name: Freeze exact post-patch base
        run: |
          set -euo pipefail
          git -C upstream config user.name "Qarro Translation Generator"
          git -C upstream config user.email "actions@users.noreply.github.com"
          git -C upstream add -A
          git -C upstream commit -m "Qarro FULL GREEN v3.173 reproduced base"

      - name: Install Argos Translate
        run: pip install --disable-pip-version-check argostranslate==1.10.0

      - name: Generate bulk Russian translation
        run: |
          set -euo pipefail
          python qarro-repo/ci/generate_bulk_ru_argos.py upstream

      - name: Audit translated surface
        run: |
          set -euo pipefail
          python qarro-repo/ci/audit_ru_runtime_surface_v3_21.py upstream
          cp upstream/build/qarro_ru_runtime_surface_v3_21_audit.json translated_audit.json
          cp upstream/build/qarro_argos_bulk_translation_report.json translation_report.json
          python - <<'PY'
          import json
          j=json.load(open("translated_audit.json",encoding="utf-8"))["fullSurface"]
          print("after candidates", j["englishOnlyCandidateCount"])
          print("after files", j["filesWithCandidates"])
          print(json.dumps(j["byFile"], ensure_ascii=False, indent=2))
          if j["englishOnlyCandidateCount"] >= 700:
              raise SystemExit("bulk translation did not reduce candidate count enough")
          PY

      - name: Build static translation-only patch
        run: |
          set -euo pipefail
          git -C upstream diff --binary HEAD -- \
            data/text/trainers.inc \
            data/text/fame_checker_frlg.inc \
            data/text/trainers_frlg.inc \
            data/scripts/cable_club_frlg.inc \
            data/text/trainer_card_frlg.inc \
            src/data/items.h \
            src/battle_message.c \
            src/strings.c \
            src/pokedex.c \
            src/data/pokemon/species_info/shared_dex_text.h \
            > bulk_ru_v3_174.patch
          test -s bulk_ru_v3_174.patch
          git -C upstream diff --check HEAD

      - name: Save generated static patch on generator branch
        run: |
          set -euo pipefail
          cp bulk_ru_v3_174.patch qarro-repo/ci/generated_bulk_ru_v3_174.patch
          cp base_audit.json qarro-repo/ci/generated_bulk_ru_v3_174_base_audit.json
          cp translated_audit.json qarro-repo/ci/generated_bulk_ru_v3_174_after_audit.json
          cp translation_report.json qarro-repo/ci/generated_bulk_ru_v3_174_report.json
          cd qarro-repo
          git config user.name "Qarro Translation Generator"
          git config user.email "actions@users.noreply.github.com"
          git add ci/generated_bulk_ru_v3_174*
          if ! git diff --cached --quiet; then
            git commit -m "generated: static bulk RU patch v3.174 [skip ci]"
            git push origin HEAD:tool/translation-probe-20260919
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bulk-ru-v3-174
          path: |
            bulk_ru_v3_174.patch
            base_audit.json
            translated_audit.json
            translation_report.json
