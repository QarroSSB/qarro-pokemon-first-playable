name: Qarro Gym test regression

on:
  push:
    branches:
      - test/gym-5of6-rework-20260911
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  gym-test-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current Gym test branch
        uses: actions/checkout@v4

      - name: Wait for exact same-commit FireRed build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p baseline regression_out
          build_run=""
          for attempt in $(seq 1 60); do
            runs="$(gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&branch=$GITHUB_REF_NAME&event=push&per_page=20")"
            build_run="$(printf '%s' "$runs" | jq -r '.workflow_runs[] | select(.path == ".github/workflows/qarro_first_playable_build.yml") | .id' | head -n1)"
            if [[ -n "$build_run" && "$build_run" != "null" ]]; then
              status="$(printf '%s' "$runs" | jq -r --argjson id "$build_run" '.workflow_runs[] | select(.id == $id) | .status')"
              conclusion="$(printf '%s' "$runs" | jq -r --argjson id "$build_run" '.workflow_runs[] | select(.id == $id) | (.conclusion // "")')"
              echo "same-commit build run=$build_run status=$status conclusion=$conclusion"
              if [[ "$status" == "completed" ]]; then
                [[ "$conclusion" == "success" ]] || exit 1
                break
              fi
            fi
            sleep 10
          done
          [[ -n "$build_run" && "$build_run" != "null" ]] || exit 1
          echo "BUILD_RUN_ID=$build_run" >> "$GITHUB_ENV"

      - name: Download exact same-commit build artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_name="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID/artifacts?per_page=100" --jq '.artifacts[] | select(.name | startswith("Qarro-FIRST-PLAYABLE-v3.8-")) | .name' | head -n1)"
          [[ -n "$artifact_name" ]] || exit 1
          gh run download "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$artifact_name" --dir baseline
          for f in Qarro_FIRST_PLAYABLE_v3_8.gba trainers_frlg.generated.h qarro_built_rom_v3_12_audit.json qarro_qol_regression_v3_10_audit.json qarro_regression_bundle_v3_11_audit.json qarro_protected_features_v3_13_audit.json qarro_applied_diff_v3_8.patch; do test -f "baseline/$f"; done
          echo "BUILD_ARTIFACT=$artifact_name" >> "$GITHUB_ENV"

      - name: Five independent current trainer and QoL evidence passes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee regression_out/static_regression.log
          from pathlib import Path
          import hashlib, json, re
          root=Path('baseline')
          rom_path=root/'Qarro_FIRST_PLAYABLE_v3_8.gba'
          generated=(root/'trainers_frlg.generated.h').read_text(encoding='utf-8')
          diff=(root/'qarro_applied_diff_v3_8.patch').read_text(encoding='utf-8',errors='replace')
          build_workflow=Path('.github/workflows/qarro_first_playable_build.yml').read_text(encoding='utf-8')
          pinned='e8bd1cd7b03fc032ea37e3ecd38b379b5d01a1e7'
          assert '- name: Checkout exact Expansion 1.17.0' in build_workflow
          assert 'repository: rh-hideout/pokeemerald-expansion' in build_workflow
          assert f'PINNED: {pinned}' in build_workflow
          assert f'ref: {pinned}' in build_workflow
          assert 'path: upstream' in build_workflow
          assert 'KIT_TGZ_SHA256: 95ca1dd309d79ecfed86e21b441725c8b68b7ec0368efc33dcf790be0d62eed9' in build_workflow
          assert 'KIT_B64_SHA256: 19e30690575cf31d941f9e183c7e52f452238a4d18759577c520909a718e01c1' in build_workflow
          assert 'make -C upstream clean' in build_workflow
          assert 'make -C upstream -j4 -O firered' in build_workflow
          def load(n): return json.loads((root/n).read_text(encoding='utf-8'))
          built=load('qarro_built_rom_v3_12_audit.json')
          rx=re.compile(r'^\s*(?:\[DIFFICULTY_[A-Z0-9_]+\])?\[(TRAINER_[A-Z0-9_]+)\]\s*=\s*$',re.M)
          ms=list(rx.finditer(generated)); blocks={m.group(1):generated[m.start():(ms[i+1].start() if i+1<len(ms) else len(generated))] for i,m in enumerate(ms)}
          leaders={
            'TRAINER_LEADER_BROCK':['GOLEM','AERODACTYL','TYRANITAR','OMASTAR','CRADILY','RHYPERIOR'],
            'TRAINER_LEADER_MISTY':['POLITOED','KINGDRA','STARMIE','GYARADOS','LANTURN','MILOTIC'],
            'TRAINER_LEADER_LT_SURGE':['ELECTRODE','RAICHU','JOLTEON','MAGNETON','ELECTIVIRE','EELEKTROSS'],
            'TRAINER_LEADER_ERIKA':['NINETALES','VENUSAUR','VICTREEBEL','VILEPLUME','JUMPLUFF','CELEBI'],
            'TRAINER_LEADER_KOGA':['CROBAT','WEEZING','MUK','NIDOKING','TENTACRUEL','DRAPION'],
            'TRAINER_LEADER_SABRINA':['ALAKAZAM','ESPEON','MR_MIME','EXEGGUTOR','SLOWKING','MEW'],
            'TRAINER_LEADER_BLAINE':['NINETALES','ARCANINE','RAPIDASH','MAGMAR','HOUNDOOM','CHANDELURE'],
            'TRAINER_LEADER_GIOVANNI':['NIDOKING','NIDOQUEEN','RHYDON','DUGTRIO','DONPHAN','HIPPOWDON']}
          banned={'REGIROCK','SUICUNE','ZAPDOS','VIRIZION','DARKRAI','MEWTWO','MOLTRES','GROUDON'}
          for n in range(1,6):
            rom=rom_path.read_bytes(); sha=hashlib.sha256(rom).hexdigest()
            assert len(rom)==33554432 and rom[0xAC:0xB0]==b'BPRE' and sha==built['sha256']
            for trainer,expected in leaders.items():
              b=blocks[trainer]; species=re.findall(r'\.species\s*=\s*SPECIES_([A-Z0-9_]+)',b)
              assert '.partySize = 6,' in b and species==expected and not(set(species)&banned),trainer
            assert 'TryCreateQarroFiveOfSixGymParty' in diff
            assert 'QARRO_GYM_FIVE_V3_26_BEGIN' in diff and 'QARRO_GYM_FIVE_V3_26_END' in diff
            assert 'partySize = PARTY_SIZE - 1' in diff
            qol=load('qarro_qol_regression_v3_10_audit.json')
            assert qol['money']['removeMoneyCalls']==0 and qol['money']['winRewardPreserved'] is True
            assert qol['failedCatchBall']['refundCalls']==1 and qol['failedCatchBall']['successStillConsumesBall'] is True and qol['failedCatchBall']['safariExcluded'] is True
            kit=qol['starterKit']; assert kit['oneTimeSceneGuard'] is True and kit['pokeBallsTotal']==20 and kit['potions']==10 and kit['antidotes']==5 and kit['paralyzeHeals']==5 and kit['duplicateNewGameGrant'] is False
            assert qol['ashBondTouched'] is False and qol['ashCapTouched'] is False
            bundle=load('qarro_regression_bundle_v3_11_audit.json'); assert bundle['policy']=='FireRed / Expansion 1.17.0 / Gen I-V' and bundle['qolRegression']=='PASS'
            protected=load('qarro_protected_features_v3_13_audit.json'); assert protected['ashBondTouched'] is False and protected['ashCapTouched'] is False and protected['protectedPathHits']==0 and protected['protectedDiffLineHits']==0
            print(f'PASS regression {n}: {sha[:16]}...; pinned FireRed upstream + six-member Gym source pools + final 5-of-6 runtime + QoL + protected features OK')
          PY

      - name: Install mGBA runtime smoke dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo add-apt-repository -y universe
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mgba-qt xvfb

      - name: Five fresh emulator boot smoke runs on current ROM
        shell: bash
        run: |
          set -euo pipefail
          ROM="$PWD/baseline/Qarro_FIRST_PLAYABLE_v3_8.gba"
          EMU="$(command -v mgba-qt || true)"; [[ -n "$EMU" ]] || EMU=/usr/games/mgba-qt
          for i in 1 2 3 4 5; do
            set +e; timeout --signal=TERM 12s xvfb-run -a -s '-screen 0 640x480x24' "$EMU" "$ROM" >"regression_out/mgba_boot_${i}.log" 2>&1; rc=$?; set -e
            [[ "$rc" -eq 124 ]] || { cat "regression_out/mgba_boot_${i}.log"; exit 1; }
          done

      - name: Write current trainer regression report
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          rom=Path('baseline/Qarro_FIRST_PLAYABLE_v3_8.gba'); out=Path('regression_out'); out.mkdir(exist_ok=True)
          report={'marker':'QARRO_TRAINER_REGRESSION_GYM_5OF6_20260921','sourceCommit':os.environ.get('GITHUB_SHA'),'sourceBuildRun':int(os.environ['BUILD_RUN_ID']) if os.environ.get('BUILD_RUN_ID') else None,'sourceArtifact':os.environ.get('BUILD_ARTIFACT'),'romSha256':hashlib.sha256(rom.read_bytes()).hexdigest() if rom.is_file() else None,'staticPassesRequested':5,'emulatorBootPassesRequested':5,'scope':'exact same-commit FireRed build + pinned Expansion 1.17.0 upstream + six-member Gym source pools + final Gym 5-of-6 runtime wiring + QoL/protected evidence + mGBA boot smoke','legacyFiveOfSixBaseline':True}
          (out/'gym_test_regression_report.json').write_text(json.dumps(report,indent=2),encoding='utf-8')
          PY

      - name: Upload current trainer regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Qarro-gym-test-regression-${{ github.run_number }}
          retention-days: 30
          path: regression_out/**
