name: Qarro FIRST PLAYABLE v3.8 readable RU+EN foundation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PINNED: e8bd1cd7b03fc032ea37e3ecd38b379b5d01a1e7
  KIT_TGZ_SHA256: 95ca1dd309d79ecfed86e21b441725c8b68b7ec0368efc33dcf790be0d62eed9
  KIT_B64_SHA256: 19e30690575cf31d941f9e183c7e52f452238a4d18759577c520909a718e01c1

jobs:
  build-firered:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Qarro build repository
        uses: actions/checkout@v4
        with:
          path: qarro-repo

      - name: Reconstruct FIRST PLAYABLE v3.0 kit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p kit/normalized_parts
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          expected = [
              ('part00', 6000, '3e940e9b1a1d3b1ef4a4414a1a1fa943a76daecdee7bc7298c28d42dbfdf4ce6'),
              ('part01', 6000, 'e94329bbc06c3c5b957cb61bdd7d598866fb2491682d6057d54d5d8ad6c0ac54'),
              ('part02', 6000, '166ecb7390b18d9880810dd9e9e2b5bb2a14609cb94a2a35967cd397b0c218d7'),
              ('part03', 6000, '70a4fa13ef17c2778aeffb53dea204476003c202372e25c87e71c3a2d18002ee'),
              ('part04', 6000, '4bcc27379e86b2ce3ce3b8183a47ba355406349e4a79b68fc826b4bf474f1321'),
              ('part05', 5320, '25b0c7a8c5ba212ffa5740107a14d5c94a3f1fddc4c3ccc84d08989c5c21779e'),
          ]

          srcdir = Path('qarro-repo/kit_parts')
          outdir = Path('kit/normalized_parts')
          for short, expected_len, expected_sha in expected:
              src = srcdir / f'qarro_kit_v3_0.{short}.b64'
              data = src.read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              if digest == expected_sha:
                  fixed = data
                  print(f'{short}: exact OK ({len(data)} bytes)')
              elif len(data) == expected_len + 1:
                  fixed = None
                  for i in range(len(data)):
                      candidate = data[:i] + data[i+1:]
                      if hashlib.sha256(candidate).hexdigest() == expected_sha:
                          print(f'{short}: repaired one transport byte at offset {i} ({data[i:i+1]!r})')
                          fixed = candidate
                          break
                  if fixed is None:
                      raise SystemExit(f'{short}: checksum mismatch; one-byte repair did not match pinned SHA')
              else:
                  raise SystemExit(f'{short}: checksum mismatch and unexpected size {len(data)} != {expected_len}')
              if len(fixed) != expected_len or hashlib.sha256(fixed).hexdigest() != expected_sha:
                  raise SystemExit(f'{short}: normalized verification failed')
              (outdir / f'{short}.b64').write_bytes(fixed)
          PY
          cat kit/normalized_parts/part*.b64 > kit/qarro_kit_text.tar.gz.b64
          echo "$KIT_B64_SHA256  kit/qarro_kit_text.tar.gz.b64" | sha256sum -c -
          base64 -d kit/qarro_kit_text.tar.gz.b64 > kit/qarro_kit_text.tar.gz
          echo "$KIT_TGZ_SHA256  kit/qarro_kit_text.tar.gz" | sha256sum -c -
          tar -xzf kit/qarro_kit_text.tar.gz -C kit

      - name: Checkout exact Expansion 1.17.0
        uses: actions/checkout@v4
        with:
          repository: rh-hideout/pokeemerald-expansion
          ref: e8bd1cd7b03fc032ea37e3ecd38b379b5d01a1e7
          path: upstream

      - name: Install FireRed ARM build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            binutils-arm-none-eabi \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libpng-dev \
            python3 \
            python3-pil
          arm-none-eabi-gcc --version | head -n 1

      - name: Validate exact FIRST BOOT kit
        shell: bash
        run: |
          set -euo pipefail
          python3 kit/Source_Migration/v3_0/tools/validate_build_kit_v3_0.py kit/Source_Migration/v3_0
          python3 kit/Source_Migration/v3_0/tools/validate_pinned_upstream_fingerprint_v3_0.py --self-test
          python3 -m py_compile \
            kit/Source_Migration/v3_0/tools/*.py \
            qarro-repo/ci/content_pass_v3_1.py \
            qarro-repo/ci/balance_kanto_v3_2.py \
            qarro-repo/ci/runtime_content_v3_3.py \
            qarro-repo/ci/kanto_wild_diversity_v3_4.py \
            qarro-repo/ci/qol_v3_5.py \
            qarro-repo/ci/install_cyrillic_v3_3.py \
            qarro-repo/ci/localization_ru_core_v3_3.py \
            qarro-repo/ci/localize_oaks_lab_starter_v3_5.py \
            qarro-repo/ci/localize_early_kanto_v3_9.py \
            qarro-repo/ci/sanitize_ru_quotes_v3_18.py \
            qarro-repo/ci/normalize_accented_e_v3_8.py

      - name: Install FIRST PLAYABLE data and config
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qarro_ci_out_v3_8/logs
          python3 kit/Source_Migration/v3_0/tools/install_first_playable_v3_0.py upstream \
            2>&1 | tee qarro_ci_out_v3_8/logs/install_preflight.log

      - name: Fix pinned Gen V compiler directive layouts
        shell: bash
        run: |
          set -euo pipefail
          python3 qarro-repo/ci/fix_rapid_spin_first_error.py upstream

      - name: Apply v3.1 early-Kanto content pass
        shell: bash
        run: |
          set -euo pipefail
          python3 qarro-repo/ci/content_pass_v3_1.py upstream \
            2>&1 | tee qarro_ci_out_v3_8/logs/content_pass_v3_1.log

      - name: Apply v3.2 low-grind Kanto gym balance and caps
        shell: bash
        run: |
          set -euo pipefail
          python3 qarro-repo/ci/balance_kanto_v3_2.py upstream \
            2>&1 | tee qarro_ci_out_v3_8/logs/balance_kanto_v3_2.log

      - name: Apply v3.3 runtime item and early encounter corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 qarro-repo/ci/runtime_content_v3_3.py upstream \
            2>&1 | tee qarro_ci_out_v3_8/logs/runtime_content_v3_3.log

      - name: Apply v3.4 full Kanto FireRed land diversity
        shell: bash
        run: |
          set -euo pipefail
          python3 qarro-repo/ci/kanto_wild_diversity_v3_4.py upstream \
            2>&1 | tee qarro_ci_out_v3_8/logs/kanto_wild_diversity_v3_4.log

      - name: Apply v3.5 starting supplies
        shell: bash
        run: |
          set -euo pipefail
          python3 qarro-repo/ci/qol_v3_5.py upstream \
            2>&1 | tee qarro_ci_out_v3_8/logs/qol_v3_5.log

      - name: Install v3.8 readable FireRed-style RU+EN font
        shell: bash
        run: |
          set -euo pipefail
          python3 qarro-repo/ci/install_cyrillic_v3_3.py upstream \
            2>&1 | tee qarro_ci_out_v3_8/logs/readable_font_v3_8.log

      - name: Apply core Russian localization
        shell: bash
        run: |
          set -euo pipefail
          python3 qarro-repo/ci/localization_ru_core_v3_3.py upstream \
            2>&1 | tee qarro_ci_out_v3_8/logs/localization_ru_core_v3_3.log

      - name: Apply verified early-Kanto Russian localization
        shell: bash
        run: |
          set -euo pipefail
          python3 qarro-repo/ci/localize_early_kanto_v3_9.py upstream \
            2>&1 | tee qarro_ci_out_v3_8/logs/localize_early_kanto_v3_9.log

      - name: Apply Oak lab starter localization
        shell: bash
        run: |
          set -euo pipefail
          python3 qarro-repo/ci/localize_oaks_lab_starter_v3_5.py upstream \
            2>&1 | tee qarro_ci_out_v3_8/logs/localization_oaks_lab_starter_v3_5.log

      - name: Normalize unsupported Russian quote marks
        shell: bash
        run: |
          set -euo pipefail
          python3 qarro-repo/ci/sanitize_ru_quotes_v3_18.py upstream \
            2>&1 | tee qarro_ci_out_v3_8/logs/sanitize_ru_quotes_v3_18.log

      - name: Normalize accented e to ordinary e after localization
        shell: bash
        run: |
          set -euo pipefail
          python3 qarro-repo/ci/normalize_accented_e_v3_8.py upstream \
            2>&1 | tee qarro_ci_out_v3_8/logs/normalize_accented_e_v3_8.log

      - name: Real ARM make firered
        shell: bash
        run: |
          set -o pipefail
          mkdir -p qarro_ci_out_v3_8/logs
          make -C upstream clean 2>&1 | tee qarro_ci_out_v3_8/logs/make_clean.log
          make -C upstream -j4 -O firered 2>&1 | tee qarro_ci_out_v3_8/logs/make_firered.log
          rc=${PIPESTATUS[0]}
          exit "$rc"

      - name: Publish exact make failure tail
        if: failure()
        shell: bash
        run: |
          {
            echo "### make firered failure diagnostics"
            echo
            echo '```text'
            grep -nEi 'error:|fatal|undefined reference|no rule to make target|not found|failed' qarro_ci_out_v3_8/logs/make_firered.log | tail -n 80 || true
            echo
            echo '--- tail ---'
            tail -n 160 qarro_ci_out_v3_8/logs/make_firered.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve exact build diagnostics and ROM
        if: always()
        shell: bash
        run: |
          mkdir -p qarro_ci_out_v3_8
          git -C upstream status --short > qarro_ci_out_v3_8/git_status_v3_8.txt || true
          git -C upstream diff --no-ext-diff > qarro_ci_out_v3_8/qarro_applied_diff_v3_8.patch || true
          if [[ -f upstream/src/data/trainers_frlg.h ]]; then cp upstream/src/data/trainers_frlg.h qarro_ci_out_v3_8/trainers_frlg.generated.h; fi
          if [[ -f upstream/build/qarro_content_v3_1_audit.json ]]; then cp upstream/build/qarro_content_v3_1_audit.json qarro_ci_out_v3_8/; fi
          if [[ -f upstream/build/qarro_runtime_v3_3_audit.json ]]; then cp upstream/build/qarro_runtime_v3_3_audit.json qarro_ci_out_v3_8/; fi
          if [[ -f upstream/build/qarro_ground_items_v3_23_audit.json ]]; then cp upstream/build/qarro_ground_items_v3_23_audit.json qarro_ci_out_v3_8/; fi
          if [[ -f upstream/build/qarro_kanto_wild_v3_4_audit.json ]]; then cp upstream/build/qarro_kanto_wild_v3_4_audit.json qarro_ci_out_v3_8/; fi
          if [[ -f upstream/build/qarro_qol_v3_5_audit.json ]]; then cp upstream/build/qarro_qol_v3_5_audit.json qarro_ci_out_v3_8/; fi
          if [[ -f upstream/build/qarro_ru_oak_lab_starter_v3_5_audit.json ]]; then cp upstream/build/qarro_ru_oak_lab_starter_v3_5_audit.json qarro_ci_out_v3_8/; fi
          if [[ -f upstream/build/qarro_ru_early_kanto_v3_9_audit.json ]]; then cp upstream/build/qarro_ru_early_kanto_v3_9_audit.json qarro_ci_out_v3_8/; fi
          if [[ -f upstream/build/qarro_ru_quotes_v3_18_audit.json ]]; then cp upstream/build/qarro_ru_quotes_v3_18_audit.json qarro_ci_out_v3_8/; fi
          if [[ -f upstream/build/qarro_normalize_e_v3_8_audit.json ]]; then cp upstream/build/qarro_normalize_e_v3_8_audit.json qarro_ci_out_v3_8/; fi
          if [[ -f upstream/build/qarro_font_variant2_v3_17_audit.json ]]; then cp upstream/build/qarro_font_variant2_v3_17_audit.json qarro_ci_out_v3_8/; fi
          for f in pokefirered.map pokefirered.sym; do [[ -f "upstream/$f" ]] && cp "upstream/$f" qarro_ci_out_v3_8/; done
          if [[ -f upstream/pokefirered.gba ]]; then
            cp upstream/pokefirered.gba qarro_ci_out_v3_8/Qarro_FIRST_PLAYABLE_v3_8.gba
            sha256sum qarro_ci_out_v3_8/Qarro_FIRST_PLAYABLE_v3_8.gba > qarro_ci_out_v3_8/Qarro_FIRST_PLAYABLE_v3_8.gba.sha256
          fi

      - name: Verify built FireRed ROM integrity and regression evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 qarro-repo/ci/audit_built_rom_v3_12.py qarro_ci_out_v3_8 \
            2>&1 | tee qarro_ci_out_v3_8/logs/built_rom_v3_12.log

      - name: Upload ROM or exact first failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Qarro-FIRST-PLAYABLE-v3.8-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 30
          path: qarro_ci_out_v3_8/**
