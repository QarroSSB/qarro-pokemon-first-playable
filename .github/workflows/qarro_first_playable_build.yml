name: Qarro FIRST PLAYABLE v3.0

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PINNED: e8bd1cd7b03fc032ea37e3ecd38b379b5d01a1e7
  KIT_TGZ_SHA256: 95ca1dd309d79ecfed86e21b441725c8b68b7ec0368efc33dcf790be0d62eed9
  KIT_B64_SHA256: 19e30690575cf31d941f9e183c7e52f452238a4d18759577c520909a718e01c1

jobs:
  build-firered:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Qarro build repository
        uses: actions/checkout@v4
        with:
          path: qarro-repo

      - name: Reconstruct FIRST PLAYABLE v3.0 kit
        shell: bash
        run: |
          set -euo pipefail
          echo '3e940e9b1a1d3b1ef4a4414a1a1fa943a76daecdee7bc7298c28d42dbfdf4ce6  qarro-repo/kit_parts/qarro_kit_v3_0.part00.b64' | sha256sum -c -
          echo 'e94329bbc06c3c5b957cb61bdd7d598866fb2491682d6057d54d5d8ad6c0ac54  qarro-repo/kit_parts/qarro_kit_v3_0.part01.b64' | sha256sum -c -
          echo '166ecb7390b18d9880810dd9e9e2b5bb2a14609cb94a2a35967cd397b0c218d7  qarro-repo/kit_parts/qarro_kit_v3_0.part02.b64' | sha256sum -c -
          echo '70a4fa13ef17c2778aeffb53dea204476003c202372e25c87e71c3a2d18002ee  qarro-repo/kit_parts/qarro_kit_v3_0.part03.b64' | sha256sum -c -
          echo '4bcc27379e86b2ce3ce3b8183a47ba355406349e4a79b68fc826b4bf474f1321  qarro-repo/kit_parts/qarro_kit_v3_0.part04.b64' | sha256sum -c -
          echo '25b0c7a8c5ba212ffa5740107a14d5c94a3f1fddc4c3ccc84d08989c5c21779e  qarro-repo/kit_parts/qarro_kit_v3_0.part05.b64' | sha256sum -c -
          mkdir -p kit
          cat qarro-repo/kit_parts/qarro_kit_v3_0.part*.b64 > kit/qarro_kit_text.tar.gz.b64
          echo "$KIT_B64_SHA256  kit/qarro_kit_text.tar.gz.b64" | sha256sum -c -
          base64 -d kit/qarro_kit_text.tar.gz.b64 > kit/qarro_kit_text.tar.gz
          echo "$KIT_TGZ_SHA256  kit/qarro_kit_text.tar.gz" | sha256sum -c -
          tar -xzf kit/qarro_kit_text.tar.gz -C kit

      - name: Checkout exact Expansion 1.17.0
        uses: actions/checkout@v4
        with:
          repository: rh-hideout/pokeemerald-expansion
          ref: e8bd1cd7b03fc032ea37e3ecd38b379b5d01a1e7
          path: upstream

      - name: Install FireRed ARM build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            binutils-arm-none-eabi \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libpng-dev \
            python3
          arm-none-eabi-gcc --version | head -n 1

      - name: Validate exact FIRST BOOT kit
        shell: bash
        run: |
          set -euo pipefail
          python3 kit/Source_Migration/v3_0/tools/validate_build_kit_v3_0.py kit/Source_Migration/v3_0
          python3 kit/Source_Migration/v3_0/tools/validate_pinned_upstream_fingerprint_v3_0.py --self-test
          python3 -m py_compile kit/Source_Migration/v3_0/tools/*.py

      - name: Real ARM make firered
        shell: bash
        run: |
          bash kit/Source_Migration/v3_0/tools/remote_build_first_playable_v3_0.sh \
            kit upstream "$GITHUB_WORKSPACE/qarro_ci_out_v3_0"

      - name: Upload ROM or exact first failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Qarro-FIRST-PLAYABLE-v3.0-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 30
          path: qarro_ci_out_v3_0/**
