name: Qarro FIRST PLAYABLE v3.0

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Qarro_FIRST_PLAYABLE_BUILD_KIT_v3_0.zip'
      - '.github/workflows/qarro_first_playable_build.yml'

permissions:
  contents: read

jobs:
  build-firered:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Qarro build repository
        uses: actions/checkout@v4

      - name: Extract exact FIRST PLAYABLE v3.0 Build Kit
        run: |
          rm -rf kitpkg
          mkdir -p kitpkg
          unzip -q Qarro_FIRST_PLAYABLE_BUILD_KIT_v3_0.zip -d kitpkg
          test -f kitpkg/Qarro_FIRST_PLAYABLE_BUILD_KIT_v3_0/Source_Migration/v3_0/tools/install_first_playable_v3_0.py

      - name: Checkout exact Expansion 1.17.0
        uses: actions/checkout@v4
        with:
          repository: rh-hideout/pokeemerald-expansion
          ref: e8bd1cd7b03fc032ea37e3ecd38b379b5d01a1e7
          path: upstream

      - name: Install upstream Ubuntu dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils-arm-none-eabi gcc-arm-none-eabi \
            libnewlib-arm-none-eabi git libpng-dev python3 unzip

      - name: Validate kit and pinned upstream
        run: |
          QARRO="$GITHUB_WORKSPACE/kitpkg/Qarro_FIRST_PLAYABLE_BUILD_KIT_v3_0"
          python3 "$QARRO/Source_Migration/v3_0/tools/validate_build_kit_v3_0.py" "$QARRO/Source_Migration/v3_0"
          python3 "$QARRO/Source_Migration/v3_0/tools/validate_pinned_upstream_fingerprint_v3_0.py" --self-test
          python3 -m py_compile "$QARRO"/Source_Migration/v3_0/tools/*.py

      - name: Build FIRST BOOT baseline
        run: |
          QARRO="$GITHUB_WORKSPACE/kitpkg/Qarro_FIRST_PLAYABLE_BUILD_KIT_v3_0"
          bash "$QARRO/Source_Migration/v3_0/tools/remote_build_first_playable_v3_0.sh" \
            "$QARRO" "$GITHUB_WORKSPACE/upstream" "$GITHUB_WORKSPACE/qarro_ci_out_v3_0"

      - name: Upload ROM or exact failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Qarro-FIRST-PLAYABLE-v3.0-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 30
          path: qarro_ci_out_v3_0/**
