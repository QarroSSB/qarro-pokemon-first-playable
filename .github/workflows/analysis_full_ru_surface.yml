name: Analysis full RU runtime surface

on:
  push:
    branches:
      - analysis/vanilla-fr-symbols-20260916
  workflow_dispatch:

permissions:
  contents: read

env:
  PINNED: e8bd1cd7b03fc032ea37e3ecd38b379b5d01a1e7
  KIT_TGZ_SHA256: 95ca1dd309d79ecfed86e21b441725c8b68b7ec0368efc33dcf790be0d62eed9
  KIT_B64_SHA256: 19e30690575cf31d941f9e183c7e52f452238a4d18759577c520909a718e01c1

jobs:
  export-full-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout analysis branch
        uses: actions/checkout@v4
        with:
          path: qarro-repo

      - name: Reconstruct exact FIRST PLAYABLE kit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p kit/normalized_parts
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          expected = [
              ('part00', 6000, '3e940e9b1a1d3b1ef4a4414a1a1fa943a76daecdee7bc7298c28d42dbfdf4ce6'),
              ('part01', 6000, 'e94329bbc06c3c5b957cb61bdd7d598866fb2491682d6057d54d5d8ad6c0ac54'),
              ('part02', 6000, '166ecb7390b18d9880810dd9e9e2b5bb2a14609cb94a2a35967cd397b0c218d7'),
              ('part03', 6000, '70a4fa13ef17c2778aeffb53dea204476003c202372e25c87e71c3a2d18002ee'),
              ('part04', 6000, '4bcc27379e86b2ce3ce3b8183a47ba355406349e4a79b68fc826b4bf474f1321'),
              ('part05', 5320, '25b0c7a8c5ba212ffa5740107a14d5c94a3f1fddc4c3ccc84d08989c5c21779e'),
          ]
          srcdir = Path('qarro-repo/kit_parts')
          outdir = Path('kit/normalized_parts')
          for short, expected_len, expected_sha in expected:
              src = srcdir / f'qarro_kit_v3_0.{short}.b64'
              data = src.read_bytes()
              if hashlib.sha256(data).hexdigest() == expected_sha:
                  fixed = data
              elif len(data) == expected_len + 1:
                  fixed = None
                  for i in range(len(data)):
                      candidate = data[:i] + data[i+1:]
                      if hashlib.sha256(candidate).hexdigest() == expected_sha:
                          fixed = candidate
                          break
                  if fixed is None:
                      raise SystemExit(f'{short}: one-byte transport repair failed')
              else:
                  raise SystemExit(f'{short}: checksum/size mismatch')
              if len(fixed) != expected_len or hashlib.sha256(fixed).hexdigest() != expected_sha:
                  raise SystemExit(f'{short}: normalized verification failed')
              (outdir / f'{short}.b64').write_bytes(fixed)
          PY
          cat kit/normalized_parts/part*.b64 > kit/qarro_kit_text.tar.gz.b64
          echo "$KIT_B64_SHA256  kit/qarro_kit_text.tar.gz.b64" | sha256sum -c -
          base64 -d kit/qarro_kit_text.tar.gz.b64 > kit/qarro_kit_text.tar.gz
          echo "$KIT_TGZ_SHA256  kit/qarro_kit_text.tar.gz" | sha256sum -c -
          tar -xzf kit/qarro_kit_text.tar.gz -C kit

      - name: Checkout exact Expansion 1.17.0
        uses: actions/checkout@v4
        with:
          repository: rh-hideout/pokeemerald-expansion
          ref: e8bd1cd7b03fc032ea37e3ecd38b379b5d01a1e7
          path: upstream

      - name: Install audit dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir Pillow

      - name: Reproduce current content and localization state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit_out/logs
          python3 kit/Source_Migration/v3_0/tools/install_first_playable_v3_0.py upstream 2>&1 | tee audit_out/logs/install_preflight.log
          python3 qarro-repo/ci/content_pass_v3_1.py upstream 2>&1 | tee audit_out/logs/content_pass_v3_1.log
          python3 qarro-repo/ci/runtime_content_v3_3.py upstream 2>&1 | tee audit_out/logs/runtime_content_v3_3.log
          python3 qarro-repo/ci/qol_v3_5.py upstream 2>&1 | tee audit_out/logs/qol_v3_5.log
          python3 qarro-repo/ci/install_cyrillic_v3_3.py upstream 2>&1 | tee audit_out/logs/readable_font_v3_8.log
          python3 qarro-repo/ci/localization_ru_core_v3_3.py upstream 2>&1 | tee audit_out/logs/localization_ru_core_v3_3.log
          python3 qarro-repo/ci/localize_early_kanto_v3_9.py upstream 2>&1 | tee audit_out/logs/localize_early_kanto_v3_9.log
          python3 qarro-repo/ci/localize_cerulean_misty_v3_22.py upstream 2>&1 | tee audit_out/logs/localize_cerulean_misty_v3_22.log
          python3 qarro-repo/ci/localize_oaks_lab_starter_v3_5.py upstream 2>&1 | tee audit_out/logs/localization_oaks_lab_starter_v3_5.log
          python3 qarro-repo/ci/sanitize_ru_quotes_v3_18.py upstream 2>&1 | tee audit_out/logs/sanitize_ru_quotes_v3_18.log
          python3 qarro-repo/ci/normalize_accented_e_v3_8.py upstream 2>&1 | tee audit_out/logs/normalize_accented_e_v3_8.log

      - name: Export complete English candidate inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 qarro-repo/ci/audit_ru_runtime_surface_v3_21.py upstream 2>&1 | tee audit_out/logs/ru_runtime_surface_v3_21.log
          cp upstream/build/qarro_ru_runtime_surface_v3_21_audit.json audit_out/
          cp upstream/build/qarro_ru_cerulean_misty_v3_22_audit.json audit_out/

      - name: Preserve current translated source surfaces
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit_out/current/src/data/pokemon/species_info audit_out/current/data/text audit_out/current/data/scripts
          cp upstream/src/strings.c audit_out/current/src/
          cp upstream/src/battle_message.c audit_out/current/src/
          for f in main_menu.c item_menu.c item_use.c party_menu.c pokemon_summary_screen.c pokedex.c pokemon_storage_system.c start_menu.c option_menu.c shop.c credits_frlg.c; do
            if [ -f "upstream/src/$f" ]; then cp "upstream/src/$f" audit_out/current/src/; fi
          done
          cp upstream/src/data/items.h audit_out/current/src/data/
          cp upstream/src/data/pokemon/species_info/shared_dex_text.h audit_out/current/src/data/pokemon/species_info/
          cp upstream/data/text/*_frlg.inc audit_out/current/data/text/ 2>/dev/null || true
          for f in trainers.inc berries.inc move_relearner.inc move_tutors.inc pc.inc pc_transfer.inc pkmn_center_nurse.inc pokedex_rating.inc save.inc; do
            if [ -f "upstream/data/text/$f" ]; then cp "upstream/data/text/$f" audit_out/current/data/text/; fi
          done
          cp upstream/data/scripts/*frlg*.inc audit_out/current/data/scripts/ 2>/dev/null || true
          for f in aide.inc day_care.inc field_move_scripts.inc route23.inc safari_zone.inc; do
            if [ -f "upstream/data/scripts/$f" ]; then cp "upstream/data/scripts/$f" audit_out/current/data/scripts/; fi
          done

      - name: Protect forbidden Ash integration paths
        shell: bash
        run: |
          set -euo pipefail
          git -C upstream diff --name-only > audit_out/changed_paths.txt
          if grep -Eqi 'ash.?bond|ash.?cap' audit_out/changed_paths.txt; then
            echo 'Forbidden Ash Bond/Ash Cap path touched' >&2
            exit 1
          fi

      - name: Upload complete analysis evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-ru-runtime-surface
          retention-days: 7
          path: audit_out/**
